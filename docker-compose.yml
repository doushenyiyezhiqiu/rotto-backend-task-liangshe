services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rotto
      POSTGRES_PASSWORD: rotto
      POSTGRES_DB: rotto
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rotto -d rotto"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Not started by `docker compose up -d` (profile); used by `make crawl` / `make test`.
  crawler:
    profiles: ["cli"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rotto:rotto@db:5432/rotto
      PROXY_URL: ${PROXY_URL:-}
      PROXY_HOST: ${PROXY_HOST:-}
      PROXY_PORT: ${PROXY_PORT:-}
      PROXY_USERNAME: ${PROXY_USERNAME:-}
      PROXY_PASSWORD: ${PROXY_PASSWORD:-}
      CRAWL_MAX_MINUTES: ${CRAWL_MAX_MINUTES:-}
      MAX_DETAILS_PER_SOURCE: ${MAX_DETAILS_PER_SOURCE:-}
      MAX_PAGES_PER_SHARD: ${MAX_PAGES_PER_SHARD:-}
      SOURCES: ${SOURCES:-}
      DETAIL_CONCURRENCY: ${DETAIL_CONCURRENCY:-}
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      - ./debug:/app/debug
      - ./tests/fixtures:/app/tests/fixtures

volumes:
  pgdata:
